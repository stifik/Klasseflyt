# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# Specifies the GitHub repository to sync with your App Hosting backend.
github:
  # The name of your GitHub repository, formatted as an owner/repo name.
  repository: stifik/Klasseflyt
  # Specifies that the live branch of your backend is tied to the main branch of your repository.
  branch: main
  # Automatically roll out new commits to your live branch.
  live: true
  # Automatically create preview channels for every pull request.
  pullRequest: true

# The location of your App Hosting backend.
# This must be one of the supported regions: https://firebase.google.com/docs/app-hosting/locations.
location: us-central1

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
