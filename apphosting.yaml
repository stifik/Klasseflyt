# apphosting.yaml
run:
  cpu: 2
  memoryMiB: 2048
  startupProbe:
    timeoutSeconds: 600
    periodSeconds: 240
    failureThreshold: 3
    tcpSocket: {}
# Required for Next.js with standalone output
# For more info, see https://firebase.google.com/docs/hosting/frameworks/nextjs
headers:
  - source: /_next/static/(.*)
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
gip: true
