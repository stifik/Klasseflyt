<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradProfile" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="logoGradProfile" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bgGradProfile)"/>
    
    <!-- Subtle background waves -->
    <path d="M -100 200 Q 300 100, 700 200 T 1500 200 L 1500 0 L -100 0 Z" 
          fill="#bae6fd" 
          opacity="0.15"/>
    
    <path d="M -100 400 Q 400 300, 900 400 T 1700 400 L 1700 0 L -100 0 Z" 
          fill="#7dd3fc" 
          opacity="0.1"/>
    
    <path d="M -100 700 Q 500 550, 1100 700 T 1900 700 L 1900 1024 L -100 1024 Z" 
          fill="#bae6fd" 
          opacity="0.12"/>
    
    <!-- Logo centered and scaled for profile -->
    <!-- Scale to ~640px for better visibility -->
    <g transform="translate(192, 192) scale(8)">
        <path d="M 15 25 Q 30 20, 40 25 T 65 25" 
              stroke="url(#logoGradProfile)" 
              stroke-width="3.5" 
              fill="none" 
              stroke-linecap="round"
              opacity="0.7"/>
        
        <path d="M 15 40 Q 30 35, 40 40 T 65 40" 
              stroke="url(#logoGradProfile)" 
              stroke-width="3.5" 
              fill="none" 
              stroke-linecap="round"
              opacity="0.55"/>
        
        <path d="M 15 55 Q 30 50, 40 55 T 65 55" 
              stroke="url(#logoGradProfile)" 
              stroke-width="3.5" 
              fill="none" 
              stroke-linecap="round"
              opacity="0.4"/>
        
        <path d="M 20 45 L 35 60 Q 50 25, 75 15" 
              stroke="#2db83d" 
              stroke-width="8" 
              fill="none" 
              stroke-linecap="round"
              stroke-linejoin="round"/>
    </g>
</svg>
